<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home – Chester App</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0071E3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <div class="page-header">
    <div>
      <div class="eyebrow">Chester · Sprachaufenthalt</div>
      <h1 style="font-size:27px;">Guten Morgen, Angel</h1>
    </div>
    <a href="notfall.html" aria-label="Notfall öffnen" class="icon-btn sos-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"></path><path d="M12 10v4"></path><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"></circle></svg>
    </a>
  </div>

  <div class="page-content">

    <a href="wetter.html" id="weather-card" class="card-lg tap-card" style="background:var(--weather-bg);display:flex;align-items:center;gap:14px;">
      <div class="empty-state">Wetter wird geladen …</div>
    </a>

    <div class="grid-2">
      <a href="unterwegs.html" class="card-lg tap-card" style="display:flex;flex-direction:column;gap:12px;">
        <div class="badge" style="background:var(--accent-blue);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2"></rect><path d="M4 12h16"></path><circle cx="8" cy="19" r="1.5"></circle><circle cx="16" cy="19" r="1.5"></circle></svg>
        </div>
        <div>
          <div style="font-weight:600;font-size:15px;">Unterwegs</div>
          <div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;">Busse & Route</div>
        </div>
      </a>
      <a href="naehe.html" class="card-lg tap-card" style="display:flex;flex-direction:column;gap:12px;">
        <div class="badge" style="background:var(--accent-orange);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12Z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
        </div>
        <div>
          <div style="font-weight:600;font-size:15px;">In der Nähe</div>
          <div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;">Läden & Restaurants</div>
        </div>
      </a>
      <a href="gruppe.html" class="card-lg tap-card" style="display:flex;flex-direction:column;gap:12px;">
        <div class="badge" style="background:var(--accent-purple);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.4"></circle><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"></path></svg>
        </div>
        <div>
          <div style="font-weight:600;font-size:15px;">Gruppe</div>
          <div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;">Wer wohnt nah?</div>
        </div>
      </a>
      <a href="mehr.html" class="card-lg tap-card" style="display:flex;flex-direction:column;gap:12px;">
        <div class="badge" style="background:var(--accent-gray);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
        </div>
        <div>
          <div style="font-weight:600;font-size:15px;">Mehr</div>
          <div style="font-size:12.5px;color:var(--text-secondary);margin-top:2px;">Stundenplan & Tools</div>
        </div>
      </a>
    </div>

    <div>
      <div style="font-weight:700;font-size:18px;letter-spacing:-0.01em;margin:4px 0 10px 0;">Heute</div>
      <div class="card" style="display:flex;gap:12px;align-items:flex-start;">
        <div style="flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent-blue);margin-top:5px;"></div>
        <div class="empty-state">Stundenplan noch nicht hinterlegt – trag ihn in <code>index.html</code> ein, sobald du ihn hast.</div>
      </div>
    </div>

  </div>

  <div class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"></path></svg>
      Home
    </a>
    <a href="unterwegs.html" class="nav-item">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2"></rect><path d="M4 12h16"></path><circle cx="8" cy="19" r="1.5"></circle><circle cx="16" cy="19" r="1.5"></circle></svg>
      Unterwegs
    </a>
    <a href="naehe.html" class="nav-item">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12Z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
      Nähe
    </a>
    <a href="gruppe.html" class="nav-item">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.4"></circle><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"></path></svg>
      Gruppe
    </a>
    <a href="mehr.html" class="nav-item">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
      Mehr
    </a>
  </div>

</div>

<script src="js/geo.js"></script>
<script src="js/weather.js"></script>
<script>
  loadWeather("weather-card");
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
